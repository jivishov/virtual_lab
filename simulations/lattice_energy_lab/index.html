<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive lattice-energy simulation for chemistry students.">
  <title>Lattice Lab · Charge, size & energy</title>
</head>
<body>
  <noscript>This simulation requires JavaScript.</noscript>
  <script>
    (async () => {
      const parts = await Promise.all(['p1.txt','p2.txt','p3.txt','p4.txt'].map(async file => {
        const response = await fetch(file, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Failed to load ${file}`);
        return response.text();
      }));
      const b64 = parts.join('');
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html = await new Response(stream).text();

      // Compact the comparison header on desktop so the interactive workbench
      // starts higher on the page. Narrow screens retain normal wrapping.
      html = html.replace(
        'What makes an ionic solid<br>hold together more strongly?',
        'What makes an ionic solid hold together more strongly?'
      );
      const compactHeaderCSS = `
<style id="compact-comparison-header">
@media (min-width:851px){
  main{padding-top:16px!important}
  .intro{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:20px!important;margin-bottom:14px!important;align-items:center!important}
  .intro .eyebrow{margin-bottom:3px!important;font-size:10px!important;letter-spacing:1.5px!important}
  .intro h1{font-size:clamp(25px,2.05vw,31px)!important;line-height:1.08!important;letter-spacing:-.8px!important;white-space:nowrap!important}
  .intro p{margin-top:5px!important;max-width:none!important;font-size:13px!important;line-height:1.35!important}
  .rule-box{min-width:330px!important;padding:9px 14px!important;border-radius:12px!important}
  .rule-box .eyebrow{margin-bottom:1px!important}
  .rule-box .equation{font-size:19px!important;line-height:1.25!important}
  .rule-box .small-text{font-size:11px!important;line-height:1.25!important;white-space:nowrap!important}
  .pair-tabs{gap:8px!important;margin-bottom:12px!important}
  .pair-tab{min-height:50px!important;padding:8px 12px!important}
  .tab-letter{height:27px!important;width:27px!important}
  .question-line{margin-bottom:8px!important}
}
@media (min-width:1200px){.intro p{white-space:nowrap!important}}
</style>`;
      html = html.replace('</head>', compactHeaderCSS + '\n</head>');

      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      console.error(error);
      document.body.innerHTML = '<main style="font-family:Arial,sans-serif;padding:2rem;max-width:760px;margin:auto"><h1>Unable to load Lattice Lab</h1><p>Please use a current version of Chrome, Edge, Firefox, or Safari and reload the page.</p></main>';
    });
  </script>
</body>
</html>
